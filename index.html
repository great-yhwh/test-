<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
      (function() {
        var packageName = "com.mintrocket.strana_development";
        var appStoreUrl = "https://apps.apple.com/ru/app/страна/id1534717460";
        
        var isAndroid = /Android/i.test(navigator.userAgent);
        var isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

        if (isAndroid) {
            var intentUrl = "intent://main#Intent;scheme=strana;package=" + packageName + 
                            ";S.browser_fallback_url=https://play.google.com/store/apps/details?id=" + packageName + ";end";
            
            window.location.href = intentUrl;
        } 
        else if (isIOS) {
            window.location.href = "strana://main";

            var delay = 2000;
            var start = Date.now();
            
            setTimeout(function() {
                var now = Date.now();
                if (now - start < delay + 500) {
                    window.location.href = appStoreUrl;
                }
            }, delay);
        } 
        else {
            window.location.href = "strana://main";
        }
      })();
    </script>
</head>
<body>
    <p style="text-align: center; margin-top: 50px; font-family: sans-serif;">
        Переходим в приложение... <br>
        Если ничего не произошло, <a href="https://apps.apple.com/ru/app/страна/id1534717460">нажмите здесь</a>.
    </p>
</body>
</html>
